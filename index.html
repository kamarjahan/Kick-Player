<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Player + Chat</title>
    <style>
        /* --- 1. Base Styles --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0e0e10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* --- 2. Main Layout --- */
        .stream-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* --- 3. Video Section --- */
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .kick-video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- 4. Chat Section --- */
        .chat-container {
            width: 350px;
            background: #0e0e10;
            border-left: 1px solid #2d3035;
            transition: margin-right 0.3s ease, transform 0.3s ease;
            position: relative;
            z-index: 5;
        }

        .kick-chat {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-hidden {
            margin-right: -350px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .chat-container {
                position: absolute;
                right: 0;
                top: 0;
                height: 100%;
                width: 80%;
                margin-right: 0;
                transform: translateX(100%);
            }
            .chat-visible-mobile {
                transform: translateX(0);
                display: block;
            }
            .chat-hidden {
                display: block; 
                margin-right: 0;
            }
        }

        /* --- 5. Overlay Header --- */
        .stream-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 20;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .stream-header.hidden { opacity: 0; }

        .controls-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .icon-btn:hover { background: #53fc18; color: black; border-color: #53fc18; }
        .icon-btn.active { background: #53fc18; color: black; }

        .live-badge {
            background-color: #53fc18;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            pointer-events: auto;
        }

        /* --- 6. Setup Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .modal-box { 
            background: #191b1f; padding: 30px; border-radius: 12px; 
            border: 1px solid #2d3035; text-align: center; width: 90%; max-width: 350px; 
        }
        .username-input { 
            width: 60%; padding: 10px; border-radius: 6px; 
            border: 1px solid #333; background: #000; color: white; outline: none; 
        }
        .watch-btn { 
            padding: 10px 20px; background: #53fc18; color: #000; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; 
        }

        .spin-anim { animation: spin 0.5s linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="modal-overlay" id="setupModal">
        <div class="modal-box">
            <h2 style="color:#53fc18; margin:0 0 15px 0;">KICK PLAYER</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="streamerName" class="username-input" placeholder="Username..." autocomplete="off">
                <button class="watch-btn" onclick="handleManualStart()">GO</button>
            </div>
        </div>
    </div>

    <div class="stream-wrapper" id="playerWrapper">
        <div class="stream-header" id="overlayMenu">
            <div class="live-badge" id="liveBadge">OFFLINE</div>
            <div class="controls-group">
                <button class="icon-btn" onclick="reloadStream()" title="Refresh">
                    <svg id="refreshIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
                <button class="icon-btn active" id="chatToggleBtn" onclick="toggleChat()" title="Toggle Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </button>
            </div>
        </div>

        <div class="video-container">
            <iframe id="kickPlayer" class="kick-video" src="" allowfullscreen="true" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        </div>
        <div class="chat-container" id="chatBox">
            <iframe id="kickChat" class="kick-chat" src=""></iframe>
        </div>
    </div>

    <script>
        const modal = document.getElementById('setupModal');
        const input = document.getElementById('streamerName');
        const videoFrame = document.getElementById('kickPlayer');
        const chatFrame = document.getElementById('kickChat');
        const chatBox = document.getElementById('chatBox');
        const chatBtn = document.getElementById('chatToggleBtn');
        const badge = document.getElementById('liveBadge');

        // --- 1. Startup Logic (Fixed for GitHub Pages) ---
        window.addEventListener('load', () => {
            // We check for the HASH (#) now, which is safer.
            // Example: mysite.com/#xqc
            const hash = window.location.hash.replace('#', '');
            
            if(hash && hash !== "") {
                loadStreamer(hash);
            }
        });

        // Listen for hash changes (if user hits back/forward button)
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if(hash) loadStreamer(hash);
        });

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") handleManualStart(); });

        function handleManualStart() {
            const username = input.value.trim();
            if (!username) return;
            
            // Set the hash (this updates URL without reloading)
            window.location.hash = username; 
            // The 'hashchange' listener above will catch this and call loadStreamer
        }

        function loadStreamer(username) {
            // Load Video
            videoFrame.src = `https://player.kick.com/${username}?autoplay=true&muted=false`;
            // Load Chat
            chatFrame.src = `https://kick.com/embed/chat/${username}/v1`;

            // UI Updates
            badge.innerText = username;
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 500);
            resetIdleTimer();
        }

        // --- 2. Chat Toggle Logic ---
        function toggleChat() {
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                chatBox.classList.toggle('chat-visible-mobile');
            } else {
                if (chatBox.style.display === 'none') {
                    chatBox.style.display = 'block';
                } else {
                    chatBox.style.display = 'none';
                }
            }
            chatBtn.classList.toggle('active');
        }

        // --- 3. Utility ---
        function reloadStream() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add("spin-anim");
            setTimeout(() => { icon.classList.remove("spin-anim"); }, 500);
            if(videoFrame.src) {
                const vSrc = videoFrame.src;
                videoFrame.src = '';
                setTimeout(() => { videoFrame.src = vSrc; }, 100);
            }
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('playerWrapper');
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- 4. Auto-Hide Menu ---
        let idleTimer;
        const overlay = document.getElementById('overlayMenu');
        const wrapper = document.getElementById('playerWrapper');

        function showMenu() {
            overlay.classList.remove('hidden');
            wrapper.style.cursor = 'default';
        }
        function hideMenu() {
            overlay.classList.add('hidden');
            wrapper.style.cursor = 'none';
        }
        function resetIdleTimer() {
            showMenu();
            clearTimeout(idleTimer);
            idleTimer = setTimeout(hideMenu, 2500);
        }

        wrapper.addEventListener('mousemove', resetIdleTimer);
        wrapper.addEventListener('click', resetIdleTimer);
        wrapper.addEventListener('touchstart', resetIdleTimer);
    </script>
</body>
</html>
